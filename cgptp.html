<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebXR Reload + Suppressor Drill</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      z-index: 10;
      max-width: 440px;
      pointer-events: none;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="hud"></div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';
    import { XRControllerModelFactory } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/XRControllerModelFactory.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b1f26);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 100);
    camera.position.set(0, 1.6, 0.1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    const hud = document.getElementById('hud');

    const hemi = new THREE.HemisphereLight(0xffffff, 0x32435a, 1.25);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(3, 5, 2);
    scene.add(dir);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 24),
      new THREE.MeshStandardMaterial({ color: 0x3f4d5a, roughness: 0.9, metalness: 0.05 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const lane = new THREE.Mesh(
      new THREE.BoxGeometry(2.8, 0.04, 10),
      new THREE.MeshStandardMaterial({ color: 0x2e3742 })
    );
    lane.position.set(0, 0.02, -4.2);
    scene.add(lane);

    const target = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.28, 0.02, 32),
      new THREE.MeshStandardMaterial({ color: 0x0b0b0b, emissive: 0x0 })
    );
    target.rotation.x = Math.PI / 2;
    target.position.set(0, 1.5, -8);
    scene.add(target);

    const bullseye = new THREE.Mesh(
      new THREE.CylinderGeometry(0.11, 0.11, 0.024, 32),
      new THREE.MeshStandardMaterial({ color: 0xff2f2f, emissive: 0x250000 })
    );
    bullseye.rotation.x = Math.PI / 2;
    bullseye.position.copy(target.position);
    scene.add(bullseye);

    const table = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 0.08, 0.55),
      new THREE.MeshStandardMaterial({ color: 0x6e5e4a, roughness: 0.7 })
    );
    table.position.set(-0.45, 1.08, -0.65);
    scene.add(table);

    const tableLegGeo = new THREE.BoxGeometry(0.06, 1.0, 0.06);
    for (const [x, z] of [[-0.95, -0.88], [0.05, -0.88], [-0.95, -0.43], [0.05, -0.43]]) {
      const leg = new THREE.Mesh(tableLegGeo, new THREE.MeshStandardMaterial({ color: 0x5f503d }));
      leg.position.set(x, 0.55, z);
      scene.add(leg);
    }

    const gun = new THREE.Group();
    const gunBodyMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.7, roughness: 0.32 });
    const accentMat = new THREE.MeshStandardMaterial({ color: 0x131313, metalness: 0.8, roughness: 0.2 });

    const slide = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.08, 0.08), gunBodyMat);
    slide.position.set(0, 0.03, 0.02);
    gun.add(slide);

    const frame = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.04, 0.08), accentMat);
    frame.position.set(0, 0.0, 0.02);
    gun.add(frame);

    const grip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.18, 0.05), gunBodyMat);
    grip.position.set(-0.08, -0.1, 0.01);
    grip.rotation.z = 0.2;
    gun.add(grip);

    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.12, 18), accentMat);
    barrel.rotation.z = Math.PI / 2;
    barrel.position.set(0.19, 0.03, 0.02);
    gun.add(barrel);

    const muzzlePoint = new THREE.Object3D();
    muzzlePoint.position.set(0.26, 0.03, 0.02);
    gun.add(muzzlePoint);

    const magWellPoint = new THREE.Object3D();
    magWellPoint.position.set(-0.03, -0.13, 0.01);
    gun.add(magWellPoint);

    camera.add(gun);
    gun.position.set(0.2, -0.18, -0.38);
    gun.rotation.set(-0.14, -0.23, 0.02);
    scene.add(camera);

    const mag = new THREE.Mesh(
      new THREE.BoxGeometry(0.04, 0.13, 0.045),
      new THREE.MeshStandardMaterial({ color: 0x313131, metalness: 0.65, roughness: 0.35 })
    );
    mag.position.set(-0.62, 1.16, -0.65);
    scene.add(mag);

    const suppressor = new THREE.Mesh(
      new THREE.CylinderGeometry(0.018, 0.018, 0.22, 20),
      new THREE.MeshStandardMaterial({ color: 0x1d1d1d, metalness: 0.72, roughness: 0.28 })
    );
    suppressor.rotation.z = Math.PI / 2;
    suppressor.position.set(-0.35, 1.16, -0.65);
    scene.add(suppressor);

    const rayLineGeom = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, -1)
    ]);

    const controllers = [];
    const controllerModelFactory = new XRControllerModelFactory();

    for (let i = 0; i < 2; i += 1) {
      const controller = renderer.xr.getController(i);
      controller.userData.index = i;
      controller.userData.holding = null;
      controller.userData.isShooting = i === 0;
      controller.add(new THREE.Line(rayLineGeom, new THREE.LineBasicMaterial({ color: 0x88ccff }))); 
      scene.add(controller);

      controller.addEventListener('squeezestart', () => onSqueezeStart(controller));
      controller.addEventListener('selectstart', () => onSelectStart(controller));

      const gripObj = renderer.xr.getControllerGrip(i);
      gripObj.add(controllerModelFactory.createControllerModel(gripObj));
      scene.add(gripObj);

      controllers.push(controller);
    }

    const grabables = [mag, suppressor];
    const muzzleWorld = new THREE.Vector3();
    const magWellWorld = new THREE.Vector3();
    const tempWorld = new THREE.Vector3();

    const state = {
      ammoInMag: 7,
      magInserted: false,
      chambered: false,
      suppressorAttached: false,
      screwProgress: 0,
      heldDesktop: null,
      shotsFired: 0,
      canShootAt: 0,
      targetFlashUntil: 0,
      message: 'Insert mag, rack slide, and shoot 7 times.',
    };

    const keys = new Set();

    window.addEventListener('keydown', (ev) => {
      const key = ev.key.toLowerCase();
      keys.add(key);

      if (key === 'e') desktopGrabOrDrop();
      if (key === 'i') attemptInsertMag(state.heldDesktop || mag);
      if (key === 'r') rackSlide();
      if (key === 'f') attemptShoot();
      if (key === 'q') screwSuppressor(state.heldDesktop || suppressor);
    });

    window.addEventListener('keyup', (ev) => keys.delete(ev.key.toLowerCase()));

    function distanceToCamera(obj) {
      obj.getWorldPosition(tempWorld);
      return tempWorld.distanceTo(camera.position);
    }

    function closestGrabableTo(positionObj) {
      let best = null;
      let bestDist = Infinity;
      for (const obj of grabables) {
        if (obj.userData.attachedToGun) continue;
        obj.getWorldPosition(tempWorld);
        const d = tempWorld.distanceTo(positionObj.position || positionObj);
        if (d < 0.22 && d < bestDist) {
          best = obj;
          bestDist = d;
        }
      }
      return best;
    }

    function attachToHolder(obj, holder) {
      if (!obj) return;
      holder.attach(obj);
      obj.position.set(0, 0, -0.08);
      obj.rotation.set(0, 0, 0);
      if (obj === suppressor) obj.rotation.z = Math.PI / 2;
      if (obj === mag) obj.position.set(0, -0.04, -0.08);
    }

    function placeOnTable(obj) {
      scene.attach(obj);
      obj.rotation.set(0, 0, obj === suppressor ? Math.PI / 2 : 0);
      if (obj === mag) obj.position.set(-0.62, 1.16, -0.65);
      if (obj === suppressor) obj.position.set(-0.35, 1.16, -0.65);
      obj.userData.attachedToGun = false;
    }

    function onSqueezeStart(controller) {
      const holding = controller.userData.holding;
      if (holding) {
        if (holding === suppressor && !state.suppressorAttached) {
          screwSuppressor(holding);
          return;
        }
        scene.attach(holding);
        controller.userData.holding = null;
        return;
      }

      const closest = closestGrabableTo(controller);
      if (closest) {
        controller.userData.holding = closest;
        attachToHolder(closest, controller);
        return;
      }

      attemptInsertMag(controller.userData.holding || mag, controller);
    }

    function onSelectStart(controller) {
      if (controller.userData.holding === suppressor && !state.suppressorAttached) {
        screwSuppressor(suppressor);
        return;
      }
      attemptShoot();
    }

    function attemptInsertMag(magObj, holder = null) {
      if (state.magInserted) {
        state.message = 'Magazine already inserted. Rack and shoot.';
        return;
      }
      if (!magObj || magObj !== mag) {
        state.message = 'Grab the magazine first.';
        return;
      }

      magWellPoint.getWorldPosition(magWellWorld);
      magObj.getWorldPosition(tempWorld);
      const d = tempWorld.distanceTo(magWellWorld);

      if (d > 0.2 && !holder) {
        state.message = 'Move mag closer to magwell, then press I.';
        return;
      }

      gun.attach(mag);
      mag.position.copy(magWellPoint.position).add(new THREE.Vector3(0, -0.055, 0));
      mag.rotation.set(0, 0, 0);
      mag.userData.attachedToGun = true;
      state.magInserted = true;
      state.ammoInMag = 7;
      state.chambered = false;
      state.message = 'Magazine seated. Rack the slide (R) to chamber a round.';

      if (holder) holder.userData.holding = null;
      if (state.heldDesktop === mag) state.heldDesktop = null;
    }

    function rackSlide() {
      if (!state.magInserted) {
        state.message = 'Insert a magazine first.';
        return;
      }
      if (state.ammoInMag <= 0) {
        state.message = 'Magazine is empty. Reload.';
        return;
      }
      state.chambered = true;
      state.message = 'Round chambered. Fire 7 shots before reloading.';
    }

    function screwSuppressor(supObj) {
      if (state.suppressorAttached) {
        state.message = 'Suppressor already attached.';
        return;
      }
      if (!supObj || supObj !== suppressor) {
        state.message = 'Grab the suppressor first.';
        return;
      }

      muzzlePoint.getWorldPosition(muzzleWorld);
      suppressor.getWorldPosition(tempWorld);
      if (tempWorld.distanceTo(muzzleWorld) > 0.22) {
        state.message = 'Bring suppressor to muzzle and rotate/screw (Q or squeeze/select).';
        return;
      }

      state.screwProgress += 0.25;
      suppressor.rotation.x += Math.PI * 0.8;
      state.message = `Screwing suppressor... ${Math.min(100, Math.round(state.screwProgress * 100))}%`;

      if (state.screwProgress >= 1) {
        gun.attach(suppressor);
        suppressor.position.copy(muzzlePoint.position).add(new THREE.Vector3(0.11, 0, 0));
        suppressor.rotation.set(0, 0, Math.PI / 2);
        suppressor.userData.attachedToGun = true;
        state.suppressorAttached = true;
        state.message = 'Suppressor locked on.';

        for (const c of controllers) {
          if (c.userData.holding === suppressor) c.userData.holding = null;
        }
        if (state.heldDesktop === suppressor) state.heldDesktop = null;
      }
    }

    function attemptShoot() {
      const now = performance.now();
      if (now < state.canShootAt) return;
      state.canShootAt = now + 120;

      if (!state.magInserted) {
        state.message = 'No magazine inserted.';
        return;
      }
      if (!state.chambered) {
        state.message = 'Rack slide first.';
        return;
      }
      if (state.ammoInMag <= 0) {
        state.chambered = false;
        state.message = 'Click. Empty magazine. Reload and rack.';
        return;
      }

      state.ammoInMag -= 1;
      state.shotsFired += 1;

      const flash = new THREE.PointLight(state.suppressorAttached ? 0x6699ff : 0xffb347, state.suppressorAttached ? 0.8 : 1.7, 2.5);
      muzzlePoint.getWorldPosition(muzzleWorld);
      flash.position.copy(muzzleWorld);
      scene.add(flash);
      setTimeout(() => scene.remove(flash), state.suppressorAttached ? 30 : 55);

      if (Math.random() > 0.25) {
        targetFlash('hit');
      } else {
        targetFlash('miss');
      }

      if (state.ammoInMag === 0) {
        state.chambered = false;
        state.magInserted = false;
        state.message = '7 shots complete. Magazine empty—grab mag, insert, and rack again.';
        scene.attach(mag);
        mag.position.set(-0.62, 1.16, -0.65);
        mag.rotation.set(0, 0, 0);
        mag.userData.attachedToGun = false;
      } else {
        state.message = `Bang${state.suppressorAttached ? ' (suppressed)' : ''}. ${state.ammoInMag} rounds left.`;
      }
    }

    function targetFlash(result) {
      target.material.color.set(result === 'hit' ? 0x3cff77 : 0x992222);
      state.targetFlashUntil = performance.now() + 120;
    }

    function desktopGrabOrDrop() {
      if (renderer.xr.isPresenting) return;

      if (state.heldDesktop) {
        placeOnTable(state.heldDesktop);
        state.heldDesktop = null;
        return;
      }

      const options = [mag, suppressor].filter((obj) => !obj.userData.attachedToGun);
      options.sort((a, b) => distanceToCamera(a) - distanceToCamera(b));
      const near = options[0];
      if (near && distanceToCamera(near) < 1.2) {
        state.heldDesktop = near;
      }
    }

    function updateDesktopHolding() {
      if (!state.heldDesktop || renderer.xr.isPresenting) return;
      const holdOffset = state.heldDesktop === mag
        ? new THREE.Vector3(0.15, -0.05, -0.4)
        : new THREE.Vector3(0.28, -0.01, -0.47);

      const worldTarget = holdOffset.clone().applyMatrix4(camera.matrixWorld);
      state.heldDesktop.position.lerp(worldTarget, 0.3);
      state.heldDesktop.quaternion.slerp(camera.quaternion, 0.3);
      if (state.heldDesktop === suppressor) {
        state.heldDesktop.rotateZ(Math.PI / 2);
      }
    }

    function updateHUD() {
      const ammoText = `${state.ammoInMag}/7`;
      const controls = renderer.xr.isPresenting
        ? 'VR: Squeeze = grab/drop/use, Select = shoot, bring mag to magwell, screw suppressor near muzzle.'
        : 'Desktop: E grab/drop, I insert mag, R rack slide, F fire, Q screw suppressor';

      hud.textContent = [
        'Meta Quest WebXR Gun Drill',
        `Ammo: ${ammoText}`,
        `Mag inserted: ${state.magInserted ? 'yes' : 'no'}`,
        `Chambered: ${state.chambered ? 'yes' : 'no'}`,
        `Suppressor: ${state.suppressorAttached ? 'attached' : `off (${Math.round(state.screwProgress * 100)}%)`}`,
        `Shots fired this run: ${state.shotsFired}`,
        '',
        controls,
        '',
        `Status: ${state.message}`
      ].join('\n');
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      updateDesktopHolding();

      if (performance.now() > state.targetFlashUntil) {
        target.material.color.set(0x0b0b0b);
      }

      updateHUD();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
